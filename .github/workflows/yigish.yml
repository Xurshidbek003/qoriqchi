name: Dasturlarni yig'ish

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK yig'ish
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EkranQoriqchisi-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: kompyuter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testlar
        run: python test_mantiq.py
      - name: EXE yig'ish
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name EkranQoriqchisi --icon models\ikonka.ico --add-data "models;models" ekran_qoriqchisi.py
      - uses: actions/upload-artifact@v4
        with:
          name: EkranQoriqchisi-windows
          path: kompyuter/dist/EkranQoriqchisi.exe

  chiqarish:
    name: Tayyor fayllarni chiqarish
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fayllar
      - name: Fayllarni tayyorlash
        run: |
          mkdir -p tayyor
          cp fayllar/EkranQoriqchisi-android/app-debug.apk tayyor/EkranQoriqchisi.apk
          cp fayllar/EkranQoriqchisi-windows/EkranQoriqchisi.exe tayyor/EkranQoriqchisi.exe
          ls -la tayyor
      - name: Release (yuklab olish sahifasi)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ekran qo'riqchisi v1.0.${{ github.run_number }}
          body: |
            📱 **EkranQoriqchisi.apk** — Android telefon uchun
            💻 **EkranQoriqchisi.exe** — Windows kompyuter uchun
          files: |
            tayyor/EkranQoriqchisi.apk
            tayyor/EkranQoriqchisi.exe
      - name: tayyor-fayllar branchiga yozish
        run: |
          cd tayyor
          git init -q -b tayyor-fayllar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Tayyor fayllar (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tayyor-fayllar
